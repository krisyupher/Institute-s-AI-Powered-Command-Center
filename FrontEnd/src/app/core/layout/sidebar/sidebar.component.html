<aside class="h-full min-h-0">
  <ul
    class="menu h-full min-h-0 w-64 gap-1 overflow-y-auto overscroll-contain bg-base-100 p-4 text-base-content"
    aria-label="Primary navigation"
  >
    @for (item of navItems(); track item.route) {
      <li>
        <a
          class="gap-3 rounded-lg px-3 py-2 transition-colors hover:bg-base-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
          [routerLink]="item.route"
          routerLinkActive="menu-active font-semibold shadow-xs"
          [routerLinkActiveOptions]="{ exact: false }"
          ariaCurrentWhenActive="page"
          (click)="closeMobileDrawer()"
        >
          @switch (item.icon) {
            @case ('dashboard') {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M3 3h7v7H3V3Zm11 0h7v7h-7V3ZM3 14h7v7H3v-7Zm11 0h7v7h-7v-7Z"
                />
              </svg>
            }
            @case ('sparkles') {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3Zm6 12 .75 2.25L21 18l-2.25.75L18 21l-.75-2.25L15 18l2.25-.75L18 15Z"
                />
              </svg>
            }
            @case ('list') {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"
                />
              </svg>
            }
            @case ('results') {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M4 19V5m0 14h16M8 16v-5m4 5V7m4 9v-8"
                />
              </svg>
            }
          }
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</aside>
