<header class="navbar min-h-16 bg-base-100 border-b border-base-200 px-4 shadow-sm">
  <div class="navbar-start gap-1">
    <label
      for="app-drawer"
      aria-label="Open navigation menu"
      title="Open navigation menu"
      class="btn btn-square btn-ghost lg:hidden"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
        focusable="false"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </label>
    <a routerLink="/dashboard" class="btn btn-ghost gap-2 px-3 text-lg font-semibold">
      <span
        class="grid h-8 w-8 place-items-center rounded-lg bg-primary text-sm font-bold text-primary-content"
        aria-hidden="true"
      >
        AI
      </span>
      <span>AI Manager</span>
    </a>
  </div>

  <div class="navbar-end gap-3">
    <div class="flex items-center gap-3 border-l border-base-200 pl-3">
      <div class="avatar placeholder">
        <div class="bg-primary text-primary-content rounded-full w-10 h-10 flex items-center justify-center font-semibold">
          <span [attr.aria-label]="user().fullName">{{ initials() }}</span>
        </div>
      </div>
      <div class="hidden text-sm leading-tight sm:block">
        <span class="block font-medium">{{ user().fullName }}</span>
        <span class="badge badge-primary badge-sm">{{ role() }}</span>
      </div>
    </div>

    @if (isAuthenticated()) {
      <button type="button" class="btn btn-ghost btn-sm gap-2" (click)="signOut()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
          focusable="false"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4m-5-4 5-5-5-5m5 5H3"
          />
        </svg>
        <span>Sign out</span>
      </button>
    }
  </div>
</header>
