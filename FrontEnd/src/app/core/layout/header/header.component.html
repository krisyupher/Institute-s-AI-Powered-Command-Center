<header class="navbar bg-base-100 border-b border-base-200 px-4">
  <div class="navbar-start gap-1">
    <label for="app-drawer" aria-label="Open menu" class="btn btn-square btn-ghost lg:hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </label>
    <a routerLink="/dashboard" class="btn btn-ghost px-3 text-lg font-semibold">AI Manager</a>
  </div>

  <div class="navbar-end gap-3">
    <div class="flex items-center gap-3">
      <div class="avatar placeholder">
        <div class="bg-primary text-primary-content rounded-full w-10 h-10 flex items-center justify-center font-semibold">
          <span>{{ initials() }}</span>
        </div>
      </div>
      <div class="hidden text-sm leading-tight sm:block">
        <span class="block font-medium">{{ user().fullName }}</span>
        <span class="badge badge-primary badge-sm">{{ role() }}</span>
      </div>
    </div>

    @if (isAuthenticated()) {
      <button type="button" class="btn btn-ghost btn-sm" (click)="signOut()">Sign out</button>
    }
  </div>
</header>
