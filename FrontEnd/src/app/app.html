<header class="topbar">
  <a routerLink="/dashboard" class="brand">Institute Command Center</a>

  <nav class="tabs">
    <a routerLink="/dashboard/student" routerLinkActive="active">Student</a>
    <a routerLink="/dashboard/teacher" routerLinkActive="active">Teacher</a>
    <a routerLink="/dashboard/admin" routerLinkActive="active">Admin</a>
  </nav>

  <!--
    Temporary link strip for the Ticket 1.5 placeholder pages, so the routes are
    clickable before FE1's sidebar (Ticket 1.4) exists. Delete this block once the
    real navigation lands — the routes themselves do not depend on it.
  -->
  <nav class="tabs stub-nav">
    <a routerLink="/login" routerLinkActive="active">Login</a>
    <a routerLink="/teacher/generator" routerLinkActive="active">Generator</a>
    <a routerLink="/teacher/quizzes" routerLinkActive="active">Quizzes</a>
    <a routerLink="/student/quizzes" routerLinkActive="active">Take</a>
    <a routerLink="/student/results" routerLinkActive="active">Results</a>
    <a routerLink="/admin/dashboard" routerLinkActive="active">Admin panel</a>
  </nav>

  <div class="who">
    <span class="small">{{ user().fullName }}</span>
    <select
      class="role-select"
      [value]="role()"
      (change)="switchRole($any($event.target).value)"
      aria-label="Demo role"
    >
      @for (option of roles; track option) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
