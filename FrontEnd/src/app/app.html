<header class="navbar sticky top-0 z-30 bg-base-100 shadow-sm">
  <div class="navbar-start">
    <a routerLink="/dashboard" class="btn btn-ghost px-3 text-lg">Institute Command Center</a>
  </div>

  <div class="navbar-center hidden md:flex">
    <ul class="menu menu-horizontal menu-sm gap-1 p-0">
      <li><a routerLink="/dashboard/student" routerLinkActive="active">Student</a></li>
      <li><a routerLink="/dashboard/teacher" routerLinkActive="active">Teacher</a></li>
      <li><a routerLink="/dashboard/admin" routerLinkActive="active">Admin</a></li>
    </ul>
  </div>

  <div class="navbar-end gap-3">
    <span class="hidden text-sm text-base-content/70 italic sm:inline">{{ user().fullName }}</span>
    <select
      class="select select-bordered select-sm"
      [value]="role()"
      (change)="switchRole($any($event.target).value)"
      aria-label="Demo role"
    >
      @for (option of roles; track option) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  </div>
</header>

<!--
  Temporary stub navigation for the Ticket 1.5 placeholder pages, so the routes are
  clickable before the real sidebar (Ticket 1.4) exists. Delete this block once the
  real navigation lands — the routes themselves do not depend on it.
-->
<nav class="overflow-x-auto border-b border-base-200 bg-base-100/70">
  <ul class="menu menu-horizontal menu-xs gap-1 w-max rounded-none p-1">
    <li><a routerLink="/login" routerLinkActive="active">Login</a></li>
    <li><a routerLink="/teacher/generator" routerLinkActive="active">Generator</a></li>
    <li><a routerLink="/teacher/quizzes" routerLinkActive="active">Quizzes</a></li>
    <li><a routerLink="/student/quizzes" routerLinkActive="active">Take</a></li>
    <li><a routerLink="/student/results" routerLinkActive="active">Results</a></li>
    <li><a routerLink="/admin/dashboard" routerLinkActive="active">Admin panel</a></li>
  </ul>
</nav>

<main class="mx-auto max-w-6xl p-6">
  <router-outlet />
</main>
