<header class="topbar">
  <a routerLink="/dashboard" class="brand">Institute Command Center</a>

  <nav class="tabs">
    <a routerLink="/dashboard/student" routerLinkActive="active">Student</a>
    <a routerLink="/dashboard/teacher" routerLinkActive="active">Teacher</a>
    <a routerLink="/dashboard/admin" routerLinkActive="active">Admin</a>
  </nav>

  <div class="who">
    <span class="small">{{ user().fullName }}</span>
    <select
      class="role-select"
      [value]="role()"
      (change)="switchRole($any($event.target).value)"
      aria-label="Demo role"
    >
      @for (option of roles; track option) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
