<header class="mb-6">
  <h1 class="text-2xl font-semibold">AI Quiz Generator</h1>
  <p class="mt-1 text-base-content/70">
    Set the criteria below and let AI draft a quiz. You'll review and edit every question
    before it's published.
  </p>
</header>

<section class="max-w-2xl mx-auto card bg-base-100 border border-base-200 shadow-sm">
  <div class="card-body">
    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-control w-full">
        <span class="label-text mb-1">Subject</span>
        <select
          class="select select-bordered w-full"
          formControlName="subjectId"
          [class.select-error]="subjectId.invalid && subjectId.touched"
          (change)="onSubjectChange($any(form.get('subjectId')?.value))"
        >
          <option [ngValue]="null" disabled>Select a subject</option>
          @for (subject of subjects(); track subject.id) {
            <option [ngValue]="subject.id">{{ subject.name }} ({{ subject.code }})</option>
          }
          <option [ngValue]="-1">Another</option>
        </select>
        @if (loadingSubjects()) {
          <span class="label-text-alt mt-1 text-base-content/60">Loading subjects…</span>
        } @else if (subjectsError()) {
          <span class="label-text-alt mt-1 text-error">{{ subjectsError() }}</span>
        } @else if (subjectId.invalid && subjectId.touched && !showCustomSubject()) {
          <span class="label-text-alt mt-1 text-error">Choose a subject.</span>
        }
      </label>

      @if (showCustomSubject()) {
        <label class="form-control w-full">
          <span class="label-text mb-1">Subject name</span>
          <input
            type="text"
            class="input input-bordered w-full"
            [value]="customSubjectName()"
            (input)="customSubjectName.set($any($event.target).value)"
            placeholder="e.g. Advanced Data Science"
          />
          <span class="label-text-alt mt-1 text-base-content/60">
            Enter a new subject that will be available for future quizzes.
          </span>
        </label>
      }

      <label class="form-control w-full">
        <span class="label-text mb-1">Difficulty</span>
        <select class="select select-bordered w-full" formControlName="difficulty">
          @for (level of difficulties; track level) {
            <option [value]="level">{{ level }}</option>
          }
        </select>
      </label>

      <label class="form-control w-full">
        <span class="label-text mb-1">Topic</span>
        <input
          type="text"
          class="input input-bordered w-full"
          formControlName="topic"
          [class.input-error]="topic.invalid && topic.touched"
          placeholder="e.g. Binary search trees"
        />
        @if (topic.invalid && topic.touched) {
          <span class="label-text-alt mt-1 text-error">
            @if (topic.hasError('required')) {
              Topic is required.
            } @else if (topic.hasError('minlength')) {
              Topic needs at least 3 characters.
            }
          </span>
        }
      </label>

      <label class="form-control w-full">
        <span class="label-text mb-1 flex items-center justify-between">
          Question count
          <span class="badge badge-soft badge-primary badge-lg tabular-nums">
            {{ form.controls.questionCount.value }}
          </span>
        </span>
        <input
          type="range"
          class="range range-primary w-full max-w-none"
          formControlName="questionCount"
          min="1"
          max="20"
          step="1"
        />
        <div class="flex justify-between text-xs text-base-content/60 mt-1">
          <span>1</span>
          <span>20</span>
        </div>
      </label>

      @if (generateError()) {
        <div class="alert alert-error">
          <span>{{ generateError() }}</span>
        </div>
      }

      <div class="card-actions justify-end">
        <button type="submit" class="btn btn-primary" [disabled]="generating() || loadingSubjects()">
          @if (generating()) {
            <span class="loading loading-spinner loading-sm"></span>
            Generating…
          } @else {
            Generate with AI
          }
        </button>
      </div>
    </form>
  </div>
</section>
